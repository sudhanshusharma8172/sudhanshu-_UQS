services:
  - type: web
    name: student-query-system
    runtime: python
    region: oregon
    plan: free

    # Install dependencies + pre-download ML model at build time
    buildCommand: pip install -r requirements.txt && python download_model.py

    # Start Gunicorn with 1 worker (fits within 512MB free tier RAM)
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120

    # Render pings /health to confirm app is ready before routing traffic
    healthCheckPath: /health

    envVars:
      - key: GEMINI_API_KEY
        sync: false       # Paste your real Gemini API key in Render dashboard manually

      - key: PYTHON_VERSION
        value: 3.11.0
