services:
  - type: web
    name: student-query-system
    runtime: python
    region: oregon
    plan: free

    # ── Build: install deps + pre-cache the ML model ──────────────────────────
    buildCommand: pip install -r requirements.txt && python download_model.py

    # ── Start: run Gunicorn with 1 worker to stay within 512MB free tier RAM ──
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120

    # ── Health check: Render pings this to know when the app is ready ─────────
    healthCheckPath: /health

    # ── Environment Variables ─────────────────────────────────────────────────
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Paste your real key manually in the Render dashboard

      - key: PYTHON_VERSION
        value: 3.11.0

      - key: PORT
        value: 10000
